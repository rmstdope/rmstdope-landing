name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run check

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build, then run end-to-end and accessibility tests
        run: npm run test:e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image for isolated smoke checks
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: rmstdope-landing:smoke
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify production HTTP behavior
        env:
          REVISION: ${{ github.sha }}
        run: python3 deploy/test_container.py rmstdope-landing:smoke --revision "$REVISION"

  publish-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, container-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish production image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/rmstdope/rmstdope-landing:sha-${{ github.sha }}
          build-args: VCS_REF=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/rmstdope/rmstdope-landing
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the published image
        env:
          IMAGE: ghcr.io/rmstdope/rmstdope-landing@${{ steps.image.outputs.digest }}
          REVISION: ${{ github.sha }}
        run: |
          docker pull "$IMAGE"
          python3 deploy/test_container.py "$IMAGE" --revision "$REVISION"
      - name: Write deployment manifest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          REVISION: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          Path("deployment.json").write_text(json.dumps({
              "revision": os.environ["REVISION"],
              "images": {
                  "web": "ghcr.io/rmstdope/rmstdope-landing@" + os.environ["IMAGE_DIGEST"]
              }
          }) + "\n")
          PY
      - name: Upload deployment manifest
        uses: actions/upload-artifact@v4
        with:
          name: deployment-manifest
          path: deployment.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true
      - name: Report immutable deployment reference
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          REVISION: ${{ github.sha }}
        run: |
          {
            echo '## Manual deployment'
            echo '```sh'
            echo "rmstdope-deploy release landing --image ghcr.io/rmstdope/rmstdope-landing@${IMAGE_DIGEST} --revision ${REVISION}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
